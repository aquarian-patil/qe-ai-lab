version: '3.8'

services:
  nexus-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-ai-engine
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
